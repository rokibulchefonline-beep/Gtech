# Netlify configuration — GTech Digital
#
# The Phase 2 prototypes live in /prototype, not the repo root. Without this,
# Netlify publishes the repo root, finds no index.html, and every request to /
# returns 404 while the real page sits at /prototype/index.html.
#
# There is no build step: these are standalone HTML/CSS/JS files.

[build]
  publish = "prototype"

# Long-lived caching for fingerprint-free static assets is not safe yet — these
# files change on every design iteration, so keep them revalidating.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL routing for single service pages
[[redirects]]
  from = "/services"
  to = "/services/index.html"
  status = 200

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/digital-marketing"
  to = "/services/digital-marketing/index.html"
  status = 200

[[redirects]]
  from = "/services/digital-marketing/seo"
  to = "/services/digital-marketing/seo/index.html"
  status = 200

[[redirects]]
  from = "/services/digital-marketing/google-meta-ads"
  to = "/services/digital-marketing/google-meta-ads/index.html"
  status = 200

[[redirects]]
  from = "/services/digital-marketing/google-meta"
  to = "/services/digital-marketing/google-meta-ads"
  status = 301

[[redirects]]
  from = "/service-digital-marketing"
  to = "/services/digital-marketing"
  status = 301

[[redirects]]
  from = "/service-digital-marketing.html"
  to = "/services/digital-marketing"
  status = 301
