<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Analytics dashboard showing campaign performance">
  <defs>
    <linearGradient id="dmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fd"/><stop offset="1" stop-color="#e8eef9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#dmSky)"/>

  <!-- browser chrome -->
  <rect x="40" y="36" width="520" height="328" rx="10" fill="#fff"/>
  <rect x="40" y="36" width="520" height="34" rx="10" fill="#0b3fb0"/>
  <rect x="40" y="60" width="520" height="10" fill="#0b3fb0"/>
  <circle cx="60" cy="53" r="4.5" fill="#ff6b60"/><circle cx="76" cy="53" r="4.5" fill="#ffd166"/><circle cx="92" cy="53" r="4.5" fill="#22d3ee"/>
  <rect x="112" y="46" width="180" height="14" rx="7" fill="#ffffff" opacity=".22"/>

  <!-- KPI row -->
  <g>
    <rect x="64" y="92" width="146" height="62" rx="6" fill="#f2f4f8"/>
    <text x="78" y="115" font-family="Poppins,sans-serif" font-size="10" fill="#626d88">Impressions</text>
    <text x="78" y="140" font-family="Poppins,sans-serif" font-size="21" font-weight="600" fill="#10131a">1.24M</text>
    <text x="164" y="140" font-family="Poppins,sans-serif" font-size="11" font-weight="600" fill="#05704f">+38%</text>
  </g>
  <g>
    <rect x="226" y="92" width="146" height="62" rx="6" fill="#f2f4f8"/>
    <text x="240" y="115" font-family="Poppins,sans-serif" font-size="10" fill="#626d88">Conversions</text>
    <text x="240" y="140" font-family="Poppins,sans-serif" font-size="21" font-weight="600" fill="#10131a">3,412</text>
    <text x="326" y="140" font-family="Poppins,sans-serif" font-size="11" font-weight="600" fill="#05704f">+62%</text>
  </g>
  <g>
    <rect x="388" y="92" width="148" height="62" rx="6" fill="#0b3fb0"/>
    <text x="402" y="115" font-family="Poppins,sans-serif" font-size="10" fill="#b9cdf5">Cost / acq.</text>
    <text x="402" y="140" font-family="Poppins,sans-serif" font-size="21" font-weight="600" fill="#ffffff">£18.40</text>
    <text x="486" y="140" font-family="Poppins,sans-serif" font-size="11" font-weight="600" fill="#22d3ee">-31%</text>
  </g>

  <!-- chart -->
  <rect x="64" y="172" width="308" height="164" rx="6" fill="#f2f4f8"/>
  <g stroke="#dfe3ec" stroke-width="1">
    <line x1="80" y1="212" x2="356" y2="212"/><line x1="80" y1="248" x2="356" y2="248"/>
    <line x1="80" y1="284" x2="356" y2="284"/><line x1="80" y1="312" x2="356" y2="312"/>
  </g>
  <polyline points="80,300 118,288 156,292 194,262 232,246 270,214 308,200 346,186"
            fill="none" stroke="#0b3fb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="80,300 118,288 156,292 194,262 232,246 270,214 308,200 346,186 346,312 80,312"
           fill="#0b3fb0" opacity=".08"/>
  <polyline points="80,308 118,306 156,300 194,298 232,290 270,286 308,278 346,272"
            fill="none" stroke="#d42d23" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <circle cx="346" cy="186" r="4" fill="#0b3fb0"/>

  <!-- channel bars -->
  <rect x="388" y="172" width="148" height="164" rx="6" fill="#f2f4f8"/>
  <text x="402" y="194" font-family="Poppins,sans-serif" font-size="10" fill="#626d88">Channels</text>
  <g>
    <text x="402" y="216" font-family="Poppins,sans-serif" font-size="9" fill="#4a5263">Organic</text>
    <rect x="402" y="222" width="118" height="7" rx="3.5" fill="#e0e4ec"/><rect x="402" y="222" width="96" height="7" rx="3.5" fill="#0b3fb0"/>
    <text x="402" y="250" font-family="Poppins,sans-serif" font-size="9" fill="#4a5263">Google Ads</text>
    <rect x="402" y="256" width="118" height="7" rx="3.5" fill="#e0e4ec"/><rect x="402" y="256" width="74" height="7" rx="3.5" fill="#22a7c4"/>
    <text x="402" y="284" font-family="Poppins,sans-serif" font-size="9" fill="#4a5263">Meta</text>
    <rect x="402" y="290" width="118" height="7" rx="3.5" fill="#e0e4ec"/><rect x="402" y="290" width="52" height="7" rx="3.5" fill="#7aa5ee"/>
    <text x="402" y="318" font-family="Poppins,sans-serif" font-size="9" fill="#4a5263">TikTok</text>
    <rect x="402" y="324" width="118" height="7" rx="3.5" fill="#e0e4ec"/><rect x="402" y="324" width="34" height="7" rx="3.5" fill="#d42d23"/>
  </g>
</svg>
