<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Mobile app screens on iOS and Android">
  <rect width="600" height="400" fill="#eef2f9"/>

  <!-- back phone -->
  <g opacity=".55">
    <rect x="96" y="70" width="142" height="270" rx="20" fill="#333a49"/>
    <rect x="104" y="86" width="126" height="238" rx="8" fill="#fff"/>
    <rect x="104" y="86" width="126" height="70" fill="#0b3fb0"/>
    <rect x="118" y="106" width="60" height="9" rx="4.5" fill="#fff" opacity=".9"/>
    <rect x="118" y="122" width="90" height="6" rx="3" fill="#fff" opacity=".5"/>
    <g fill="#f2f4f8"><rect x="118" y="172" width="98" height="40" rx="5"/><rect x="118" y="220" width="98" height="40" rx="5"/><rect x="118" y="268" width="98" height="40" rx="5"/></g>
  </g>

  <!-- front phone -->
  <rect x="240" y="40" width="164" height="320" rx="24" fill="#10131a"/>
  <rect x="249" y="58" width="146" height="284" rx="10" fill="#ffffff"/>
  <rect x="300" y="46" width="44" height="7" rx="3.5" fill="#333a49"/>

  <!-- app header -->
  <rect x="249" y="58" width="146" height="92" fill="#0b3fb0"/>
  <text x="266" y="86" font-family="Poppins,sans-serif" font-size="9" fill="#a9c5f6">Good morning</text>
  <text x="266" y="106" font-family="Poppins,sans-serif" font-size="14" font-weight="600" fill="#fff">Dashboard</text>
  <rect x="266" y="118" width="112" height="22" rx="4" fill="#ffffff" opacity=".16"/>
  <circle cx="278" cy="129" r="4" fill="#22d3ee"/>
  <rect x="288" y="126" width="66" height="6" rx="3" fill="#fff" opacity=".55"/>

  <!-- stat tiles -->
  <rect x="266" y="164" width="52" height="52" rx="6" fill="#f2f4f8"/>
  <text x="278" y="186" font-family="Poppins,sans-serif" font-size="14" font-weight="600" fill="#10131a">86</text>
  <text x="278" y="200" font-family="Poppins,sans-serif" font-size="7" fill="#626d88">Orders</text>
  <rect x="326" y="164" width="52" height="52" rx="6" fill="#d42d23"/>
  <text x="338" y="186" font-family="Poppins,sans-serif" font-size="14" font-weight="600" fill="#fff">4.7</text>
  <text x="338" y="200" font-family="Poppins,sans-serif" font-size="7" fill="#ffd8d5">Rating</text>

  <!-- list -->
  <g>
    <rect x="266" y="230" width="112" height="30" rx="5" fill="#f2f4f8"/>
    <circle cx="282" cy="245" r="7" fill="#0b3fb0"/>
    <rect x="296" y="240" width="52" height="5" rx="2.5" fill="#c5cad4"/><rect x="296" y="249" width="34" height="4" rx="2" fill="#dfe3ec"/>
    <rect x="266" y="266" width="112" height="30" rx="5" fill="#f2f4f8"/>
    <circle cx="282" cy="281" r="7" fill="#22a7c4"/>
    <rect x="296" y="276" width="52" height="5" rx="2.5" fill="#c5cad4"/><rect x="296" y="285" width="34" height="4" rx="2" fill="#dfe3ec"/>
  </g>

  <!-- tab bar -->
  <rect x="249" y="310" width="146" height="32" fill="#f8f8f6"/>
  <g fill="#c5cad4"><circle cx="284" cy="326" r="5"/><circle cx="322" cy="326" r="5"/><circle cx="360" cy="326" r="5"/></g>
  <circle cx="284" cy="326" r="5" fill="#0b3fb0"/>

  <!-- store badges -->
  <g font-family="Poppins,sans-serif" font-size="9" fill="#4a5263">
    <rect x="424" y="150" width="118" height="40" rx="6" fill="#fff" stroke="#e3e5ea"/>
    <text x="440" y="167" font-size="8" fill="#626d88">Download on</text>
    <text x="440" y="181" font-size="11" font-weight="600" fill="#10131a">App Store</text>
    <rect x="424" y="200" width="118" height="40" rx="6" fill="#fff" stroke="#e3e5ea"/>
    <text x="440" y="217" font-size="8" fill="#626d88">Get it on</text>
    <text x="440" y="231" font-size="11" font-weight="600" fill="#10131a">Google Play</text>
  </g>
</svg>
