<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Custom software system with connected services and automation">
  <rect width="600" height="400" fill="#0b1830"/>

  <!-- connections -->
  <g stroke="#3f6fd6" stroke-width="1.5" fill="none" opacity=".7">
    <path d="M300 196 L152 118"/><path d="M300 196 L152 278"/>
    <path d="M300 196 L452 118"/><path d="M300 196 L452 278"/>
    <path d="M300 196 L300 88"/><path d="M300 196 L300 316"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="226" cy="157" r="3"/><circle cx="226" cy="237" r="3"/>
    <circle cx="376" cy="157" r="3"/><circle cx="376" cy="237" r="3"/>
    <circle cx="300" cy="142" r="3"/><circle cx="300" cy="256" r="3"/>
  </g>

  <!-- core -->
  <rect x="240" y="160" width="120" height="72" rx="8" fill="#0b3fb0"/>
  <rect x="240" y="160" width="120" height="72" rx="8" fill="none" stroke="#3f6fd6"/>
  <text x="300" y="188" text-anchor="middle" font-family="Poppins,sans-serif" font-size="12" font-weight="600" fill="#fff">Core system</text>
  <text x="300" y="207" text-anchor="middle" font-family="Poppins,sans-serif" font-size="9" fill="#9dc0f5">Business logic</text>
  <rect x="266" y="214" width="68" height="4" rx="2" fill="#22d3ee" opacity=".8"/>

  <!-- nodes -->
  <g font-family="Poppins,sans-serif" font-size="9" fill="#c9d6ef">
    <g><rect x="86" y="94" width="132" height="48" rx="6" fill="#152744" stroke="#2c4470"/><text x="102" y="115" font-size="10" font-weight="600" fill="#fff">CRM</text><text x="102" y="130">Two-way sync</text></g>
    <g><rect x="86" y="254" width="132" height="48" rx="6" fill="#152744" stroke="#2c4470"/><text x="102" y="275" font-size="10" font-weight="600" fill="#fff">Payments</text><text x="102" y="290">Reconciliation</text></g>
    <g><rect x="382" y="94" width="132" height="48" rx="6" fill="#152744" stroke="#2c4470"/><text x="398" y="115" font-size="10" font-weight="600" fill="#fff">Inventory</text><text x="398" y="130">Live stock feed</text></g>
    <g><rect x="382" y="254" width="132" height="48" rx="6" fill="#152744" stroke="#2c4470"/><text x="398" y="275" font-size="10" font-weight="600" fill="#fff">Reporting</text><text x="398" y="290">Scheduled exports</text></g>
    <g><rect x="234" y="60" width="132" height="34" rx="6" fill="#152744" stroke="#2c4470"/><text x="250" y="82" font-size="10" font-weight="600" fill="#fff">REST / API layer</text></g>
    <g><rect x="234" y="308" width="132" height="34" rx="6" fill="#152744" stroke="#2c4470"/><text x="250" y="330" font-size="10" font-weight="600" fill="#fff">Workflow automation</text></g>
  </g>

  <!-- status -->
  <g font-family="Poppins,sans-serif" font-size="9">
    <circle cx="52" cy="372" r="4" fill="#22d3ee"/>
    <text x="64" y="376" fill="#8ea6cf">All services operational</text>
